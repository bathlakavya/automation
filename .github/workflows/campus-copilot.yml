name: Campus Copilot

on:
  schedule:
    - cron: "0 2 * * *"  # 07:30 Asia/Kolkata
    - cron: "30 12 * * *" # 18:00 Asia/Kolkata
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        required: true
        type: choice
        options:
          - daily
          - reminder

permissions:
  contents: read

concurrency:
  group: campus-copilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama/models
      HERMES_MODEL: hermes3:3b
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      TWILIO_SID: ${{ secrets.TWILIO_SID }}
      TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
      TWILIO_WA_FROM: ${{ secrets.TWILIO_WA_FROM }}
      TWILIO_WA_TO: ${{ secrets.TWILIO_WA_TO }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
    steps:
      - name: Check out Campus Copilot
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hermes model
        uses: actions/cache@v4
        with:
          path: .ollama/models
          key: ollama-hermes3-3b-v1

      - name: Restore Campus Copilot memory
        uses: actions/cache@v4
        with:
          path: data
          key: copilot-data-${{ github.run_id }}
          restore-keys: |
            copilot-data-

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          mkdir -p "$OLLAMA_MODELS"
          ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then
            cat /tmp/ollama.log
            exit 1
          fi

      - name: Download Hermes model if not cached
        run: |
          if ! ollama show "$HERMES_MODEL" >/dev/null 2>&1; then
            ollama pull "$HERMES_MODEL"
          fi

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Write optional Google API credentials
        run: |
          mkdir -p secrets
          chmod 700 secrets
          python - <<'PY'
          import os
          from pathlib import Path

          for secret, filename in (
              ("GOOGLE_CREDENTIALS_JSON", "credentials.json"),
              ("GOOGLE_TOKEN_JSON", "token.json"),
          ):
              value = os.environ.get(secret)
              if value:
                  Path("secrets", filename).write_text(value, encoding="utf-8")
          PY

      - name: Run daily brief
        if: (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'daily')
        run: python -m campus_copilot run

      - name: Run deadline reminder
        if: (github.event_name == 'schedule' && github.event.schedule == '30 12 * * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'reminder')
        run: python -m campus_copilot remind
