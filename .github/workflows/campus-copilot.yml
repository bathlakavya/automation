name: Campus Copilot

on:
  schedule:
    - cron: "30 0-22/2 * * *" # Check important assignment deadline milestones every 2 hours
    - cron: "*/5 * * * *" # Check due personal reminders and important Classroom emails
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        required: true
        type: choice
        options:
          - daily
          - reminder
          - scheduled-tick
          - assist
          - telegram-pa
          - telegram-test
      mode:
        description: For assist, choose coding help or study help
        required: true
        default: coding
        type: choice
        options:
          - coding
          - study
      request:
        description: Request text for Hermes or the Telegram task assistant
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'schedule' && 'campus-copilot-scheduled' || format('campus-copilot-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama/models
      HERMES_MODEL: hermes3:3b
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      TWILIO_SID: ${{ secrets.TWILIO_SID }}
      TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
      TWILIO_WA_FROM: ${{ secrets.TWILIO_WA_FROM }}
      TWILIO_WA_TO: ${{ secrets.TWILIO_WA_TO }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out Campus Copilot
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hermes model
        if: github.event_name == 'workflow_dispatch' && (inputs.task == 'daily' || inputs.task == 'assist' || inputs.task == 'telegram-pa')
        uses: actions/cache@v4
        with:
          path: .ollama/models
          key: ollama-hermes3-3b-v1

      - name: Restore Campus Copilot memory
        uses: actions/cache@v4
        with:
          path: data
          key: copilot-data-${{ github.run_id }}
          restore-keys: |
            copilot-data-

      - name: Install and start Ollama
        if: github.event_name == 'workflow_dispatch' && (inputs.task == 'daily' || inputs.task == 'assist' || inputs.task == 'telegram-pa')
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          mkdir -p "$OLLAMA_MODELS"
          ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then
            cat /tmp/ollama.log
            exit 1
          fi

      - name: Download Hermes model if not cached
        if: github.event_name == 'workflow_dispatch' && (inputs.task == 'daily' || inputs.task == 'assist' || inputs.task == 'telegram-pa')
        run: |
          if ! ollama show "$HERMES_MODEL" >/dev/null 2>&1; then
            ollama pull "$HERMES_MODEL"
          fi

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Write optional Google API credentials
        run: |
          mkdir -p secrets
          chmod 700 secrets
          python - <<'PY'
          import os
          from pathlib import Path

          for secret, filename in (
              ("GOOGLE_CREDENTIALS_JSON", "credentials.json"),
              ("GOOGLE_TOKEN_JSON", "token.json"),
          ):
              value = os.environ.get(secret)
              if value:
                  Path("secrets", filename).write_text(value, encoding="utf-8")
          PY

      - name: Run daily brief
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'daily'
        run: python -m campus_copilot run

      - name: Run deadline reminder
        if: (github.event_name == 'schedule' && github.event.schedule == '30 0-22/2 * * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'reminder')
        run: python -m campus_copilot remind

      - name: Deliver due Telegram reminders and check Classroom email
        if: (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'scheduled-tick')
        run: python -m campus_copilot scheduled-tick

      - name: Answer coding or study request
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'assist'
        env:
          ASSIST_MODE: ${{ inputs.mode }}
          ASSIST_REQUEST: ${{ inputs.request }}
        run: |
          if [ -z "$ASSIST_REQUEST" ]; then
            echo "Enter a question in the request field."
            exit 1
          fi
          python -m campus_copilot assist "$ASSIST_MODE" "$ASSIST_REQUEST"

      - name: Execute Telegram calendar or note task
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'telegram-pa'
        env:
          PA_REQUEST: ${{ inputs.request }}
        run: |
          if [ -z "$PA_REQUEST" ]; then
            echo "Enter a task request."
            exit 1
          fi
          python -m campus_copilot pa "$PA_REQUEST"

      - name: Report task failure to Telegram
        if: failure() && github.event_name == 'workflow_dispatch' && (inputs.task == 'assist' || inputs.task == 'telegram-pa')
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          text = "I couldn’t complete that task. Check the GitHub Actions run for details."
          request = Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps({"chat_id": chat_id, "text": text}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(request, timeout=20) as response:
              if not json.loads(response.read()).get("ok"):
                  raise SystemExit("Telegram rejected the task failure notification.")
          PY

      - name: Send Telegram test notification
        if: github.event_name == 'workflow_dispatch' && inputs.task == 'telegram-test'
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          if not token or not chat_id:
              sys.exit("Configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in repository Actions secrets.")

          try:
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat_id, "text": "Campus Copilot test: Telegram notifications are connected."},
                  timeout=20,
              )
              response.raise_for_status()
              if not response.json().get("ok"):
                  sys.exit("Telegram did not accept the test message; check the bot and chat ID.")
          except requests.RequestException as exc:
              sys.exit(f"Telegram test failed ({type(exc).__name__}); check the bot token and network.")

          print("Telegram test notification sent.")
          PY
